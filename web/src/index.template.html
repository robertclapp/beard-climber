<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden; background: #181040;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: none;
  }
  /* the safe-area-padded box the canvas is centred (letterboxed) in */
  #wrap {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; touch-action: none;
  }
  canvas {
    display: block; touch-action: none;
    image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: -moz-crisp-edges;
  }
</style>
</head>
